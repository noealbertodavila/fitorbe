<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Fitorbe · La app para coaches de bienestar y entrenamiento</title>
    <meta name="description" content="Fitorbe: rutinas, planes de comida, seguimiento emocional, mensajes y pagos de tus clientes, con tu marca. Prueba 14 días gratis." />
    <meta name="theme-color" content="#0A0F0D" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fitorbe" />
    <link rel="canonical" href="https://fitorbe.com/" />
    <meta property="og:url" content="https://fitorbe.com/" />
    <meta property="og:title" content="Fitorbe · La app para coaches de bienestar y entrenamiento" />
    <meta property="og:description" content="Acompaña a tus clientes en cuerpo y mente desde una sola app. Prueba 14 días gratis." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
      body { margin: 0; background: #0A0F0D; }
      #app-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #0A0F0D;
        font-family: 'Inter', system-ui, sans-serif;
        text-align: center;
      }
      #app-loading h1 { color: #fff; font-size: 1.6rem; margin-bottom: 6px; letter-spacing: 1px; }
      #app-loading h1 span { color: #10B981; }
      #app-loading p { color: #4B7A5E; font-size: 0.85rem; }
      #app-loading .dot {
        display: inline-block; width: 8px; height: 8px;
        border-radius: 50%; background: #10B981;
        animation: blink 1.2s infinite ease-in-out;
        margin: 0 3px;
      }
      #app-loading .dot:nth-child(2) { animation-delay: 0.2s; }
      #app-loading .dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes blink { 0%,80%,100% { opacity: 0.2; } 40% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loading">
        <div>
          <h1>Fit<span>orbe</span></h1>
          <p style="margin-bottom:20px">Cargando tu panel&hellip;</p>
          <div>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/arranque.js"></script>
  </body>
</html>
