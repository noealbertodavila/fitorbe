    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..700&family=Syne:wght@600..800&display=swap" rel="stylesheet">
    <style>
      body { margin: 0; background: #0A0F0D; }
      #app-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #0A0F0D;
        font-family: 'DM Sans', system-ui, sans-serif;
        text-align: center;
      }
      #app-loading h1 { color: #fff; font-size: 1.6rem; margin-bottom: 6px; letter-spacing: 1px; }
      #app-loading h1 span { color: #10B981; }
      #app-loading p { color: #4B7A5E; font-size: 0.85rem; }
      #app-loading .dot {
        display: inline-block; width: 8px; height: 8px;
        border-radius: 50%; background: #10B981;
        animation: blink 1.2s infinite ease-in-out;
        margin: 0 3px;
      }
      #app-loading .dot:nth-child(2) { animation-delay: 0.2s; }
      #app-loading .dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes blink { 0%,80%,100% { opacity: 0.2; } 40% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loading">
        <div>
          <h1>NAHOFIT<span>.LIFE</span></h1>
          <p style="margin-bottom:20px">Cargando tu panel&hellip;</p>
          <div>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        var el = document.getElementById('root');
        if (el) {
          el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0A0F0D;font-family:'DM Sans',system-ui,sans-serif;text-align:center;padding:20px"><div><h2 style="color:#fff;margin-bottom:8px">NAHOFIT<span style="color:#10B981">.LIFE</span></h2><p style="color:#4B7A5E;margin-bottom:20px">Ocurrió un error al cargar la aplicación.</p><button onclick="location.reload()" style="background:#10B981;color:#fff;border:none;padding:10px 24px;border-radius:6px;cursor:pointer;margin-right:10px">Recargar</button><button onclick="localStorage.removeItem(\'nahofit_auth_token\');location.href=\'/\'" style="background:transparent;color:#4B7A5E;border:1px solid #1A2E20;padding:10px 24px;border-radius:6px;cursor:pointer">Ir al login</button></div></div>';
        }
        return false;
      };
    </script>
  </body>
</html>
