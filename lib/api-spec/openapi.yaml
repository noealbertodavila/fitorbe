openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NAHOFIT.LIFE API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: usuarios
    description: User management
  - name: clientes
    description: Client management
  - name: rutinas
    description: Workout routines
  - name: biblioteca
    description: Exercise library
  - name: nutricion
    description: Nutrition plans
  - name: progreso
    description: Progress tracking
  - name: checkin
    description: Daily check-ins
  - name: emocional
    description: Emotional wellness
  - name: diario
    description: Mental diary
  - name: mensajes
    description: Messaging
  - name: pagos
    description: Payments
  - name: reportes
    description: Reports
  - name: ai
    description: AI features
  - name: anthropic
    description: Anthropic AI chat operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /usuarios:
    get:
      operationId: listUsuarios
      tags: [usuarios]
      summary: List all users (admin)
      parameters:
        - name: rol
          in: query
          schema:
            type: string
        - name: activo
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Usuario"
    post:
      operationId: createUsuario
      tags: [usuarios]
      summary: Create user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUsuarioBody"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"

  /usuarios/{id}:
    put:
      operationId: updateUsuario
      tags: [usuarios]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUsuarioBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
    delete:
      operationId: deleteUsuario
      tags: [usuarios]
      summary: Delete user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /clientes:
    get:
      operationId: listClientes
      tags: [clientes]
      summary: List clients
      parameters:
        - name: activo
          in: query
          schema:
            type: boolean
        - name: nivel
          in: query
          schema:
            type: string
        - name: objetivo
          in: query
          schema:
            type: string
        - name: modalidad
          in: query
          schema:
            type: string
        - name: buscar
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClienteDetalle"

  /clientes/{id}:
    get:
      operationId: getCliente
      tags: [clientes]
      summary: Get client details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteDetalle"
    put:
      operationId: updateCliente
      tags: [clientes]
      summary: Update client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUsuarioBody"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteDetalle"

  /dashboard/coach:
    get:
      operationId: getDashboardCoach
      tags: [reportes]
      summary: Coach dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardCoach"

  /dashboard/admin:
    get:
      operationId: getDashboardAdmin
      tags: [reportes]
      summary: Admin dashboard summary
      responses:
        "200":
          description: Admin dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardAdmin"

  /dashboard/cliente/{id}:
    get:
      operationId: getDashboardCliente
      tags: [reportes]
      summary: Client dashboard summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardCliente"

  /rutinas/{clienteId}/{semanaInicio}:
    get:
      operationId: getRutina
      tags: [rutinas]
      summary: Get weekly routine for a client
      parameters:
        - name: clienteId
          in: path
          required: true
          schema:
            type: integer
        - name: semanaInicio
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Weekly routine
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rutina"

  /rutinas:
    post:
      operationId: createRutina
      tags: [rutinas]
      summary: Create/update routine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRutinaBody"
      responses:
        "201":
          description: Created routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rutina"

  /rutinas/generar-ai:
    post:
      operationId: generarRutinaAI
      tags: [rutinas]
      summary: Generate routine with AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerarRutinaAIBody"
      responses:
        "200":
          description: Generated routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RutinaGenerada"

  /biblioteca-ejercicios:
    get:
      operationId: listBibliotecaEjercicios
      tags: [biblioteca]
      summary: List exercise library
      parameters:
        - name: grupoMuscular
          in: query
          schema:
            type: string
        - name: buscar
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Exercise library
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ejercicio"
    post:
      operationId: createEjercicio
      tags: [biblioteca]
      summary: Add exercise to library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEjercicioBody"
      responses:
        "201":
          description: Created exercise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ejercicio"

  /planes-comida/{clienteId}/{semanaInicio}:
    get:
      operationId: getPlanComida
      tags: [nutricion]
      summary: Get weekly meal plan for a client
      parameters:
        - name: clienteId
          in: path
          required: true
          schema:
            type: integer
        - name: semanaInicio
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Weekly meal plan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanComida"

  /planes-comida:
    post:
      operationId: createPlanComida
      tags: [nutricion]
      summary: Create/update meal plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanComidaBody"
      responses:
        "201":
          description: Created meal plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanComida"

  /planes-comida/generar-ai:
    post:
      operationId: generarPlanComidaAI
      tags: [nutricion]
      summary: Generate meal plan with AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerarPlanComidaAIBody"
      responses:
        "200":
          description: Generated meal plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanComidaGenerado"

  /progreso/{clienteId}:
    get:
      operationId: getProgreso
      tags: [progreso]
      summary: Get client progress records
      parameters:
        - name: clienteId
          in: path
          required: true
          schema:
            type: integer
        - name: limite
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Progress records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegistroProgreso"

  /progreso:
    post:
      operationId: createProgreso
      tags: [progreso]
      summary: Record progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProgresoBody"
      responses:
        "201":
          description: Progress recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistroProgreso"

  /checkins/{clienteId}/{fecha}:
    get:
      operationId: getCheckin
      tags: [checkin]
      summary: Get daily check-in
      parameters:
        - name: clienteId
          in: path
          required: true
          schema:
            type: integer
        - name: fecha
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Daily check-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckinDiario"

  /checkins:
    post:
      operationId: createCheckin
      tags: [checkin]
      summary: Record daily check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckinBody"
      responses:
        "201":
          description: Check-in recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckinDiario"

  /checkins/semana/{clienteId}:
    get:
      operationId: getCheckinsSemanales
      tags: [checkin]
      summary: Get weekly check-ins for calendar view
      parameters:
        - name: clienteId
          in: path
          required: true
          schema:
            type: integer
        - name: semanaInicio
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Weekly check-ins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CheckinDiario"

  /emocional/{clienteId}:
    get:
      operationId: getCheckinsEmocionales
      tags: [emocional]
      summary: Get emotional check-ins for a client
      parameters:
        - name: clienteId
          in: path
          required: true
          schema:
            type: integer
        - name: limite
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Emotional check-ins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CheckinEmocional"

  /emocional:
    post:
      operationId: createCheckinEmocional
      tags: [emocional]
      summary: Record emotional check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckinEmocionalBody"
      responses:
        "201":
          description: Emotional check-in recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckinEmocional"

  /emocional/alertas:
    get:
      operationId: getAlertasEmocionales
      tags: [emocional]
      summary: Get clients with low emotional state alerts
      responses:
        "200":
          description: Emotional alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertaEmocional"

  /diario/{clienteId}:
    get:
      operationId: getDiario
      tags: [diario]
      summary: Get mental diary entries
      parameters:
        - name: clienteId
          in: path
          required: true
          schema:
            type: integer
        - name: limite
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Diary entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntradaDiario"

  /diario:
    post:
      operationId: createEntradaDiario
      tags: [diario]
      summary: Create diary entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntradaDiarioBody"
      responses:
        "201":
          description: Diary entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntradaDiario"

  /mensajes/{userId}:
    get:
      operationId: getMensajes
      tags: [mensajes]
      summary: Get messages for a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: conUsuarioId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mensaje"

  /mensajes:
    post:
      operationId: createMensaje
      tags: [mensajes]
      summary: Send a message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMensajeBody"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensaje"

  /mensajes/{id}/leido:
    put:
      operationId: marcarMensajeLeido
      tags: [mensajes]
      summary: Mark message as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Message marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mensaje"

  /mensajes/conversaciones:
    get:
      operationId: listConversaciones
      tags: [mensajes]
      summary: List conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversacion"

  /pagos/{clienteId}:
    get:
      operationId: getPagos
      tags: [pagos]
      summary: Get payments for a client (0 = all)
      parameters:
        - name: clienteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pago"

  /pagos:
    get:
      operationId: getAllPagos
      tags: [pagos]
      summary: Get all payments
      responses:
        "200":
          description: All payment records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pago"
    post:
      operationId: createPago
      tags: [pagos]
      summary: Record payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePagoBody"
      responses:
        "201":
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pago"

  /pagos/stats:
    get:
      operationId: getPagosStats
      tags: [pagos]
      summary: Get payment statistics
      responses:
        "200":
          description: Payment statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagosStats"

  /pagos/alertas:
    get:
      operationId: getAlertasPagos
      tags: [pagos]
      summary: Get clients with overdue payments
      responses:
        "200":
          description: Payment alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertaPago"

  /pagos/{id}/estado:
    patch:
      operationId: updatePagoEstado
      tags: [pagos]
      summary: Update payment status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                estado:
                  type: string
                  enum: [pagado, pendiente, vencido]
                notas:
                  type: string
                proxPago:
                  type: string
      responses:
        "200":
          description: Updated payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pago"

  /reportes/adherencia:
    get:
      operationId: getReporteAdherencia
      tags: [reportes]
      summary: Get global adherence report
      responses:
        "200":
          description: Adherence report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporteAdherencia"

  /reportes/ingresos:
    get:
      operationId: getReporteIngresos
      tags: [reportes]
      summary: Get income report
      responses:
        "200":
          description: Income report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporteIngresos"

  /ai/frase-motivacional/{clienteId}:
    get:
      operationId: getFraseMotivacional
      tags: [ai]
      summary: Get personalized motivational phrase
      parameters:
        - name: clienteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Motivational phrase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FraseMotivacional"

  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: AI coach chat (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIChatBody"
      responses:
        "200":
          description: SSE stream of AI response
          content:
            text/event-stream: {}

  /anthropic/conversations:
    get:
      operationId: listAnthropicConversations
      tags: [anthropic]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicConversation"
    post:
      operationId: createAnthropicConversation
      tags: [anthropic]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnthropicConversationBody"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversation"

  /anthropic/conversations/{id}:
    get:
      operationId: getAnthropicConversation
      tags: [anthropic]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
    delete:
      operationId: deleteAnthropicConversation
      tags: [anthropic]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"

  /anthropic/conversations/{id}/messages:
    get:
      operationId: listAnthropicMessages
      tags: [anthropic]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicMessage"
    post:
      operationId: sendAnthropicMessage
      tags: [anthropic]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendAnthropicMessageBody"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        mensaje:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        mensaje:
          type: string
      required:
        - mensaje

    LoginBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        usuario:
          $ref: "#/components/schemas/Usuario"
      required:
        - token
        - usuario

    Usuario:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        email:
          type: string
        rol:
          type: string
          enum: [admin, coach, cliente]
        telefono:
          type: string
          nullable: true
