# Blueprint de Render: Fitorbe (fitorbe.com), plataforma para coaches.
# DATABASE_URL se pega en Render al crear el Blueprint; no se guarda en el código.
# La base de Fitorbe es aparte de Obrix y de NAHOFIT.

services:
  - type: web
    name: fitorbe
    runtime: node
    plan: starter
    region: oregon
    branch: main
    # El último paso crea o actualiza las tablas en la base de datos.
    buildCommand: >-
      npx --yes pnpm@10 install --frozen-lockfile --prod=false
      && PORT=3000 BASE_PATH=/ NODE_ENV=production npx pnpm@10 --filter @workspace/nahofit run build
      && npx pnpm@10 --filter @workspace/api-server run build
      && npx pnpm@10 --filter @workspace/db run push
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Llave de la cuenta de Anthropic para las funciones de IA (rutinas, comida, asistente).
      - key: ANTHROPIC_API_KEY
        sync: false
      # Cuenta del superadmin (Noe): se crea sola la primera vez si no hay ninguno.
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      # Correos (formulario de fitorbe.com): la llave de Resend se pega en Render.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: "Fitorbe <admin@nexuvoltsolutions.com>"
      - key: ADMIN_NOTIFY_EMAIL
        value: admin@nexuvoltsolutions.com
